<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" role="img" aria-label="CCTV Dubai by Mideatek — SIRA Approved">
  <title>CCTV Dubai by Mideatek</title>
  <desc>Official logo of CCTV Dubai — by Mideatek Information Technology LLC, Dubai UAE</desc>

  <!-- Icon badge: navy rounded square -->
  <rect x="8" y="5" width="100" height="100" rx="18" fill="#1B3F7C"/>

  <!-- Subtle inner glow ring -->
  <rect x="14" y="11" width="88" height="88" rx="13" fill="none" stroke="white" stroke-width="1" stroke-opacity="0.12"/>

  <!-- Camera icon — outline style, white on navy -->
  <!-- Camera body -->
  <rect x="28" y="56" width="60" height="32" rx="6" fill="none" stroke="white" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Viewfinder bump -->
  <rect x="33" y="43" width="18" height="16" rx="5" fill="none" stroke="white" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Lens outer ring -->
  <circle cx="58" cy="72" r="11" fill="none" stroke="white" stroke-width="3.5"/>
  <!-- Lens pupil -->
  <circle cx="58" cy="72" r="4.5" fill="white"/>
  <!-- Record LED -->
  <circle cx="79" cy="63" r="4" fill="#DC2626"/>

  <!-- Brand name -->
  <text font-family="'Arial Black', 'Franklin Gothic Heavy', Impact, sans-serif" font-weight="900" letter-spacing="-0.5">
    <tspan x="124" y="68" font-size="44" fill="#1B3F7C">CCTV</tspan><tspan y="68" font-size="44" fill="#2563EB">DUBAI</tspan><tspan y="68" font-size="36" fill="#94A3B8">.ME</tspan>
  </text>

  <!-- Separator line -->
  <line x1="124" y1="76" x2="440" y2="76" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Tagline -->
  <text x="126" y="90" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10.5" letter-spacing="2" fill="#64748B">BY MIDEATEK  ·  SIRA APPROVED  ·  ISO 9001:2015</text>
</svg>
