<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="CCTV Dubai — Mideatek">
  <title>CCTV Dubai — Mideatek Icon</title>
  <desc>Square icon logo of CCTV Dubai by Mideatek, Dubai UAE</desc>

  <!-- Background -->
  <rect width="200" height="200" rx="44" fill="#1B3F7C"/>

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="184" height="184" rx="37" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Camera icon — bold white outline, centered -->
  <!-- Camera body -->
  <rect x="40" y="102" width="120" height="60" rx="11" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round"/>
  <!-- Viewfinder bump -->
  <rect x="49" y="78" width="34" height="28" rx="9" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round"/>
  <!-- Lens outer ring -->
  <circle cx="100" cy="132" r="23" fill="none" stroke="white" stroke-width="6"/>
  <!-- Lens inner ring -->
  <circle cx="100" cy="132" r="10" fill="none" stroke="white" stroke-width="3"/>
  <!-- Lens pupil -->
  <circle cx="100" cy="132" r="4" fill="white"/>
  <!-- Record LED -->
  <circle cx="142" cy="115" r="7" fill="#DC2626"/>

  <!-- "CCTV DUBAI" micro text at bottom for context -->
  <text x="100" y="184" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="16" letter-spacing="1" fill="white" fill-opacity="0.55" text-anchor="middle">CCTVDUBAI.ME</text>
</svg>
