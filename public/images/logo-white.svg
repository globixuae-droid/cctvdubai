<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" role="img" aria-label="CCTV Dubai by Mideatek — white version">
  <title>CCTV Dubai by Mideatek — White Logo</title>
  <desc>White version of the CCTV Dubai logo for use on dark and colored backgrounds</desc>

  <!-- Icon badge: white rounded square -->
  <rect x="8" y="5" width="100" height="100" rx="18" fill="white" fill-opacity="0.15"/>
  <rect x="8" y="5" width="100" height="100" rx="18" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Camera icon — white on transparent -->
  <rect x="28" y="56" width="60" height="32" rx="6" fill="none" stroke="white" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="33" y="43" width="18" height="16" rx="5" fill="none" stroke="white" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="58" cy="72" r="11" fill="none" stroke="white" stroke-width="3.5"/>
  <circle cx="58" cy="72" r="4.5" fill="white"/>
  <circle cx="79" cy="63" r="4" fill="#FF4444"/>

  <!-- Brand name — all white -->
  <text font-family="'Arial Black', 'Franklin Gothic Heavy', Impact, sans-serif" font-weight="900" letter-spacing="-0.5">
    <tspan x="124" y="68" font-size="44" fill="white">CCTV</tspan><tspan y="68" font-size="44" fill="white" fill-opacity="0.85">DUBAI</tspan><tspan y="68" font-size="36" fill="white" fill-opacity="0.5">.ME</tspan>
  </text>

  <!-- Separator -->
  <line x1="124" y1="76" x2="440" y2="76" stroke="white" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Tagline -->
  <text x="126" y="90" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10.5" letter-spacing="2" fill="white" fill-opacity="0.6">BY MIDEATEK  ·  SIRA APPROVED  ·  ISO 9001:2015</text>
</svg>
